version: "3.9"

services:
  kali_attacker:
    image: kalilinux/kali-rolling
    container_name: s04_kali_attacker
    hostname: kali-attacker
    command: /bin/bash -lc "sleep infinity"
    cap_add:
      - NET_ADMIN
    networks:
      public_net:
        ipv4_address: 172.19.0.5

  m2_pivot:
    build:
      context: ../../images/meta_full
      dockerfile: Dockerfile
    container_name: s04_m2_pivot
    hostname: s04-m2-pivot
    restart: unless-stopped
    command: /bin/bash -lc "/bin/services.sh || true; tail -f /dev/null"
    networks:
      public_net:
        ipv4_address: 172.19.0.10
      internal_net:
        ipv4_address: 172.18.0.2

  m2_internal_smb:
    build:
      context: ../../images/meta_smb
      dockerfile: Dockerfile
    container_name: s04_m2_internal_smb
    hostname: s04-m2-internal-smb
    restart: unless-stopped
    command: /bin/bash -lc "/bin/services.sh || true; tail -f /dev/null"
    networks:
      internal_net:
        ipv4_address: 172.18.0.20

  m2_internal_distcc:
    build:
      context: ../../images/meta_distcc
      dockerfile: Dockerfile
    container_name: s04_m2_internal_distcc
    hostname: s04-m2-internal-distcc
    restart: unless-stopped
    command: /bin/bash -lc "/bin/services.sh || true; tail -f /dev/null"
    networks:
      internal_net:
        ipv4_address: 172.18.0.30

  m2_internal_web:
    build:
      context: ../../images/meta_web
      dockerfile: Dockerfile
    container_name: s04_m2_internal_web
    hostname: s04-m2-internal-web
    restart: unless-stopped
    command: /bin/bash -lc "/bin/services.sh || true; tail -f /dev/null"
    networks:
      internal_net:
        ipv4_address: 172.18.0.40

networks:
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1

  internal_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
