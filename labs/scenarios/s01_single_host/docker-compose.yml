services:
  meta_full:
    build:
      context: ../../images/meta_full
      dockerfile: Dockerfile
    container_name: s01_meta_full
    hostname: s01-meta-full
    restart: unless-stopped
    command: /bin/bash -lc "/bin/services.sh || true; tail -f /dev/null"
    networks:
      labnet1:
        ipv4_address: 10.6.6.10

networks:
  labnet1:
    driver: bridge
    ipam:
      config:
        - subnet: 10.6.6.0/24
          gateway: 10.6.6.1
